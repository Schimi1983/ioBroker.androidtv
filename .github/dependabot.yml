version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '41 3 * * 3'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    assignees:
      - Schimi1983
    versioning-strategy: increase
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '47 3 * * 3'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    assignees:
      - Schimi1983
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
