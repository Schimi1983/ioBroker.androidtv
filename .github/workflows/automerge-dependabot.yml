# Auto-merge Dependabot PRs according to the rules in .github/auto-merge.yml
name: Auto-Merge Dependabot PRs

on:
  # PRs created by dependabot get write access, so 'pull_request_target' is not required
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
